          description: >-
            ### Registra o Usuário — `POST /auth/register`



            **Descrição:** cria um novo usuário e passa os tokens. 


            **Autenticação:** **JWT obrigatório** `Authorization: Bearer
            <access_token>`.


            **Caminho completo:** `POST /auth/register`.



            **Body (JSON — `CreateUserDto`):**



            **`name`** — string


            **`email`** - string


            **`password`** — string



            **Resposta HTTP (envelope global):**



            - **200** — usuário criado. **`data`** = `User`: `id`, `name`,
            `email`, `createdAt`, `updatedAt`.


            - **400** — validação do body (`email`/`password` inválido, campos
            extra com `forbidNonWhitelisted`, etc.).



            **Exemplo de URL:**


            - `POST http://localhost:3000/auth/register`
          sortKey: -1783846709415
