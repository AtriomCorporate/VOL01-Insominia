          description: >-
            ### Registra o Usuário — `POST /auth/register`



            **Descrição:** cria um novo usuário e passa os tokens. 



            **Caminho completo:** `POST /auth/register`.



            **Body (JSON — `CreateUserDto`):**



            **`name`** — string


            **`email`** - string


            **`password`** — string



            **Resposta HTTP (envelope global):**



            - **201** — usuário criado (retorna JW Tokens) **`data`** =
            `tokens`: `token`, `refreshToken`.


            - **400** — validação do body (`name` / `email` / `password`
            inválido, campos extra com `forbidNonWhitelisted`, etc.).



            **Exemplo de URL:**


            - `POST http://localhost:3000/auth/register`
